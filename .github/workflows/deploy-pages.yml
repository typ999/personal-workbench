name: Deploy Personal Workbench to GitHub Pages
# 经验 2306979：使用 peaceiris/actions-gh-pages v4（ubuntu-latest）避免 Git smart-HTTP 传输超时。
# 触发器：push 到 main 分支 / 手动触发（workflow_dispatch）
on:
  push:
    branches: [ main ]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.jpg'
      - '**/*.png'
      - '**/*.svg'
      - '**/*.webp'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install & deploy to gh-pages (经验 2306979：v4 + force_orphan，规避 smart-HTTP 超时)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
          # 经验 2306979：排除不需要部署的文件（避免敏感/临时/构建脚本上传）
          exclude_assets: '.github,_*.ps1,_*.bat,.trae,supabase,api,scripts,node_modules,package.json,package-lock.json,vercel.json,DEPLOY-PHASE2-操作手册.html,personal-workbench-prd-v2.1.html,.gitignore,*.tmp*,_syntax_check.html,_tmp-deploy-check.html,merge*.ps1'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
