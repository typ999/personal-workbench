<!DOCTYPE html>
<html lang="zh" data-trae-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人工作台</title>
<meta name="theme-color" content="#6BA88F">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg,#f5f3ef);font-family:system-ui,-apple-system,sans-serif}
  .ld{text-align:center;color:#888}
  .ld svg{margin-bottom:12px}
</style>
</head>
<body>
<div class="ld">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6BA88F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5"/><path d="M6 10.5V19h12v-8.5"/></svg>
  <div>正在加载…</div>
</div>
<script>
(function(){
  var BREAK = 900;
  var DESKTOP = 'workbench-desktop.html';
  var MOBILE  = 'workbench-mobile.html';

  // PWA 注册（http/https 协议下）
  if(location.protocol==='http:'||location.protocol==='https:'){
    if('serviceWorker' in navigator){
      try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
    }
  }

  var cur = '';
  function pick(){
    return window.innerWidth < BREAK ? MOBILE : DESKTOP;
  }

  // 如果 URL hash 里有 Supabase 登录回调（access_token / error_description），
  // 必须等 Supabase SDK 加载并处理完 session 后再跳转，否则 session 会丢失。
  var hasAuthHash = /access_token|refresh_token|error_description|type=/.test(location.hash || '');

  function doRedirect(){
    var target = pick();
    var suffix = location.hash || '';
    location.replace(target + suffix);
  }

  if(hasAuthHash){
    // 先把 SDK 加载好，等它处理完 URL 里的 session（存到 localStorage）再跳
    document.querySelector('.ld').innerHTML = '<div>⏳ 正在完成登录…</div>';
    var s1 = document.createElement('script');
    s1.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s1.onload = function(){
      // SDK 加载完，再给 1.5 秒让它解析 URL hash 并保存 session
      setTimeout(doRedirect, 1500);
    };
    s1.onerror = function(){
      // CDN 加载失败也跳转（不阻塞用户）
      doRedirect();
    };
    document.head.appendChild(s1);
  } else {
    // 普通访问：直接跳转（不留 history 条目）
    doRedirect();
  }

  // 旋转设备/手动拖拽窗口跨断点时自动切换（仅限已跳转后的交互；这里在跳转前不会触发）
  var lastW = window.innerWidth;
  var timer = null;
  window.addEventListener('resize', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      var w = window.innerWidth;
      if((w < BREAK) !== (lastW < BREAK)){
        lastW = w;
        location.replace(pick() + location.hash);
      }
    }, 350);
  });
})();
</script>
</body>
</html>
