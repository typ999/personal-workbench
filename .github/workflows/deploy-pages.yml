name: Deploy Personal Workbench to GitHub Pages
# 官方部署方式：actions/deploy-pages（不依赖 git push，用 GitHub API 部署，避免 exit code 128）
on:
  push:
    branches: [ main ]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.json'
      - '**/*.jpg'
      - '**/*.png'
      - '**/*.svg'
      - '**/*.webp'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build artifact
        run: |
          mkdir -p ./_site
          # 只复制需要部署的静态文件（排除 .github / supabase / api / scripts / node_modules / *.ps1 等）
          rsync -av \
            --exclude='.github' \
            --exclude='.trae' \
            --exclude='supabase' \
            --exclude='api' \
            --exclude='scripts' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='vercel.json' \
            --exclude='.gitignore' \
            --exclude='_*.ps1' \
            --exclude='_*.bat' \
            --exclude='merge*.ps1' \
            --exclude='*.tmp*' \
            --exclude='DEPLOY-PHASE2-操作手册.html' \
            --exclude='personal-workbench-prd-v2.1.html' \
            --exclude='_syntax_check.html' \
            --exclude='_tmp-deploy-check.html' \
            --exclude='.git' \
            ./ ./_site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
